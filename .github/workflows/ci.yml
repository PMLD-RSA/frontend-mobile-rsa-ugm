name: Mobile CI Pipeline

on:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches:
      - dev
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Doctor · TypeCheck · Tests · Dry Export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Expo SDK 58 Diagnostic (Healthcheck)
        run: npx expo-doctor

      - name: TypeScript Type-Safety Validation
        run: npm run typecheck

      - name: Run Automated Unit Tests & Coverage
        run: npm run test:ci

      - name: Expo Production Dry Run Export (Android & iOS Bundle)
        run: npx expo export --no-bytecode
        env:
          EXPO_PUBLIC_BFF_URL: "http://localhost:3000"
          EXPO_PUBLIC_WS_URL: "ws://localhost:8000/ws"
