name: Mobile Multi-Stage CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - dev
      - main

jobs:
  # ============================================================================
  # STAGE 1: HEALTHCHECK & TYPE VALIDATION
  # Memvalidasi 20 parameter kesehatan SDK 58 dan type-safety TypeScript
  # ============================================================================
  healthcheck-and-typecheck:
    name: Stage 1 · Expo Doctor & TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Expo SDK 58 Diagnostic (20 Parameter Healthcheck)
        run: npx expo-doctor

      - name: TypeScript Type-Safety Validation
        run: npm run typecheck

  # ============================================================================
  # STAGE 2: AUTOMATED UNIT TESTING & COVERAGE
  # Berjalan jika Stage 1 berhasil. Menjalankan Jest test suite & code coverage
  # ============================================================================
  unit-tests:
    name: Stage 2 · Unit Tests & Coverage
    needs: [healthcheck-and-typecheck]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Automated Unit Tests (Jest & Coverage)
        run: npm run test:ci

  # ============================================================================
  # STAGE 3: EXPO PRODUCTION DRY RUN EXPORT
  # Berjalan jika Stage 2 berhasil. Memvalidasi bundling Android & iOS
  # ============================================================================
  production-dry-export:
    name: Stage 3 · Production Bundle Dry Run
    needs: [unit-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Expo Production Dry Run Export (Android & iOS Bundle)
        run: npx expo export --no-bytecode
        env:
          EXPO_PUBLIC_BFF_URL: "http://localhost:3000"
          EXPO_PUBLIC_WS_URL: "ws://localhost:8000/ws"
