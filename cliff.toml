# ==============================================================================
# GIT-CLIFF CONFIG — SI-POTA Mobile (RSA UGM)
# ==============================================================================
# Auto versioning + auto changelog dari Conventional Commits.
# Tool: git-cliff (https://github.com/orhun/git-cliff)
# Format output: Keep a Changelog (https://keepachangelog.com/id/1.0.0/)
# Versi: SemVer (https://semver.org/lang/id/)
# ==============================================================================

[changelog]
header = """# CHANGELOG — SI-POTA Mobile (RSA UGM)

Semua perubahan signifikan pada aplikasi mobile didokumentasikan di sini. File ini
di-generate otomatis oleh [git-cliff](https://github.com/orhun/git-cliff) dari Conventional Commits.
Format mengikuti [Keep a Changelog](https://keepachangelog.com/id/1.0.0/) dan
penomoran versi mengikuti [SemVer](https://semver.org/lang/id/).

---
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}

### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}[**BREAKING**] {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^merge:", skip = true },
  { message = "^feat", group = "✨ Fitur Baru" },
  { message = "^fix", group = "🛠️ Perbaikan Bug" },
  { message = "^perf", group = "⚡ Performa & Rendering" },
  { message = "^style", group = "🎨 UI / UX & Desain" },
  { message = "^refactor", group = "♻️ Refactor" },
  { message = "^docs", group = "📝 Dokumentasi" },
  { message = "^test", group = "✅ Pengujian" },
  { message = "^chore|^ci|^build", group = "📦 Internal & CI" },
  { message = ".*", group = "🔒 Lainnya" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = "v0.0.0"
ignore_tags = ""
topo_order = false
sort_commits = "oldest"

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
